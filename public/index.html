<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Mentor Hub</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <h1>AI Mentor Hub</h1>
      <span id="user-badge" class="badge"></span>
    </div>
    <button id="logout-btn" class="ghost-btn">ログアウト</button>
  </header>

  <div id="announcement-banner" class="announcement-banner hidden"></div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="schedule">📅 予定</button>
    <button class="tab-btn" data-tab="chat">💬 チャット</button>
    <button class="tab-btn" data-tab="manual">📘 マニュアル</button>
    <button class="tab-btn" data-tab="ask">🤖 質問する</button>
  </nav>

  <main>
    <!-- ② Boss schedule + own schedule + appointment -->
    <section id="tab-schedule" class="tab-panel active">
      <div class="card">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="card calendar-card">
        <div class="calendar-header">
          <button type="button" id="cal-prev" class="ghost-btn small-btn">‹ 前月</button>
          <h2 id="cal-range-label"></h2>
          <div class="calendar-header-right">
            <button type="button" id="cal-today" class="ghost-btn small-btn">今月</button>
            <button type="button" id="cal-next" class="ghost-btn small-btn">次月 ›</button>
          </div>
        </div>
        <div class="calendar-legend">
          <span class="legend-item"><span class="legend-dot mine"></span>自分の予定</span>
          <span class="legend-item"><span class="legend-dot boss"></span>上司の予定</span>
          <span class="legend-item"><span class="legend-dot pending"></span>申請中</span>
        </div>
        <div class="calendar-scroll">
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
        <p class="empty-msg calendar-hint">日付をクリックすると、予定の追加・上司へのアポイント申請ができます。</p>
      </div>
    </section>

    <!-- ① AI Q&A -->
    <section id="tab-ask" class="tab-panel">
      <div class="card">
        <h2>会社のルール・技術について質問する</h2>
        <form id="ask-form">
          <input type="text" id="ask-input" placeholder="例：有給休暇の申請方法は？" required />
          <button type="submit">質問する</button>
        </form>
        <div id="ask-result" class="answer-box hidden"></div>
      </div>

      <div id="knowledge-admin" class="card hidden">
        <h2>ナレッジ管理（上司のみ）</h2>
        <form id="knowledge-form" class="grid-form">
          <input type="text" id="k-question" placeholder="質問（例：有給休暇の申請方法は？）" required />
          <input type="text" id="k-keywords" placeholder="キーワード（カンマ区切り）" />
          <input type="text" id="k-category" placeholder="カテゴリ（例：総務・技術）" />
          <textarea id="k-answer" placeholder="回答内容" required></textarea>
          <button type="submit">ナレッジを追加</button>
        </form>
        <ul id="knowledge-list" class="entry-list"></ul>
      </div>
    </section>

    <!-- ③ Manual (rules / technical key points / announcements) -->
    <section id="tab-manual" class="tab-panel">
      <div class="card">
        <h2>マニュアル</h2>
        <div id="manual-list"></div>
      </div>

      <div id="manual-admin" class="card hidden">
        <h2>マニュアル管理（上司のみ）</h2>
        <form id="manual-form" class="grid-form">
          <select id="mn-category">
            <option value="ルール">ルール</option>
            <option value="技術要点">技術要点</option>
            <option value="お知らせ">お知らせ</option>
          </select>
          <input type="text" id="mn-title" placeholder="タイトル（例：有給休暇の申請ルール）" required />
          <textarea id="mn-description" placeholder="内容"></textarea>
          <button type="submit">追加</button>
        </form>
        <ul id="manual-admin-list" class="entry-list"></ul>
      </div>
    </section>

    <!-- ④ Direct chat -->
    <section id="tab-chat" class="tab-panel">
      <div class="card chat-card">
        <h2>上司と部下のチャット</h2>
        <div id="chat-partner-select-wrap" class="hidden">
          <label>チャット相手を選択
            <select id="chat-partner-select"></select>
          </label>
        </div>
        <div id="chat-thread" class="chat-thread"></div>
        <form id="chat-form" class="chat-input-row">
          <input type="text" id="chat-input" placeholder="メッセージを入力" required />
          <button type="submit">送信</button>
        </form>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-box-header">
        <h3 id="modal-title"></h3>
        <button type="button" id="modal-close" class="ghost-btn small-btn">✕</button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
