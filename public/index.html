<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Mentor Hub</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <h1>AI Mentor Hub</h1>
      <span id="user-badge" class="badge"></span>
    </div>
    <button id="logout-btn" class="ghost-btn">ログアウト</button>
  </header>

  <div id="announcement-banner" class="announcement-banner hidden"></div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="ask">🤖 質問する</button>
    <button class="tab-btn" data-tab="schedule">📅 上司の予定</button>
    <button class="tab-btn" data-tab="tech">💡 今日の技術</button>
    <button class="tab-btn" data-tab="chat">💬 チャット</button>
  </nav>

  <main>
    <!-- ① AI Q&A -->
    <section id="tab-ask" class="tab-panel active">
      <div class="card">
        <h2>会社のルール・技術について質問する</h2>
        <form id="ask-form">
          <input type="text" id="ask-input" placeholder="例：有給休暇の申請方法は？" required />
          <button type="submit">質問する</button>
        </form>
        <div id="ask-result" class="answer-box hidden"></div>
      </div>

      <div id="knowledge-admin" class="card hidden">
        <h2>ナレッジ管理（上司のみ）</h2>
        <form id="knowledge-form" class="grid-form">
          <input type="text" id="k-question" placeholder="質問（例：有給休暇の申請方法は？）" required />
          <input type="text" id="k-keywords" placeholder="キーワード（カンマ区切り）" />
          <input type="text" id="k-category" placeholder="カテゴリ（例：総務・技術）" />
          <textarea id="k-answer" placeholder="回答内容" required></textarea>
          <button type="submit">ナレッジを追加</button>
        </form>
        <ul id="knowledge-list" class="entry-list"></ul>
      </div>
    </section>

    <!-- ② Boss schedule + appointment -->
    <section id="tab-schedule" class="tab-panel">
      <div class="card">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="card calendar-card">
        <div class="calendar-header">
          <button type="button" id="cal-prev" class="ghost-btn small-btn">‹ 前週</button>
          <h2 id="cal-range-label"></h2>
          <div class="calendar-header-right">
            <button type="button" id="cal-today" class="ghost-btn small-btn">今週</button>
            <button type="button" id="cal-next" class="ghost-btn small-btn">次週 ›</button>
          </div>
        </div>
        <div class="calendar-scroll">
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
        <p class="empty-msg calendar-hint">空いている時間帯をクリックすると予定の確認・アポイント申請ができます。</p>
      </div>
    </section>

    <!-- ③ Today's tech tip -->
    <section id="tab-tech" class="tab-panel">
      <div class="card">
        <h2>今日使う技術</h2>
        <div id="tech-today" class="tip-list"></div>
      </div>

      <div id="tech-admin" class="card hidden">
        <h2>技術Tip管理（上司のみ）</h2>
        <form id="tech-form" class="grid-form">
          <input type="date" id="tt-date" required />
          <input type="text" id="tt-technology" placeholder="技術名（例：React Hooks）" required />
          <input type="text" id="tt-related" placeholder="関連タスク（任意）" />
          <textarea id="tt-description" placeholder="説明・注意点"></textarea>
          <button type="submit">Tipを追加</button>
        </form>
        <ul id="tech-list" class="entry-list"></ul>
      </div>
    </section>

    <!-- ④ Direct chat -->
    <section id="tab-chat" class="tab-panel">
      <div class="card chat-card">
        <h2>上司と部下のチャット</h2>
        <div id="chat-partner-select-wrap" class="hidden">
          <label>チャット相手を選択
            <select id="chat-partner-select"></select>
          </label>
        </div>
        <div id="chat-thread" class="chat-thread"></div>
        <form id="chat-form" class="chat-input-row">
          <input type="text" id="chat-input" placeholder="メッセージを入力" required />
          <button type="submit">送信</button>
        </form>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-box-header">
        <h3 id="modal-title"></h3>
        <button type="button" id="modal-close" class="ghost-btn small-btn">✕</button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
