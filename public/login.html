<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ジェネギャすきる - ログイン</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <img src="logo.jpg" alt="ジェネギャすきる" class="logo-img logo-img-login" />
    <p class="subtitle">上司と部下をつなぐ社内サポートアプリ</p>
    <form id="login-form">
      <label>ユーザー名
        <input type="text" id="username" autocomplete="username" required />
      </label>
      <label>パスワード
        <input type="password" id="password" autocomplete="current-password" required />
      </label>
      <button type="submit">ログイン</button>
      <p id="login-error" class="error-text"></p>
    </form>
    <div class="demo-accounts">
      <p>デモ用アカウント</p>
      <ul>
        <li>上司: <code>boss</code> / <code>boss123</code></li>
        <li>部下: <code>staff1</code> / <code>staff123</code></li>
        <li>部下: <code>staff2</code> / <code>staff123</code></li>
      </ul>
    </div>
  </div>

  <div id="announce-modal" class="announce-modal hidden">
    <div class="announce-card">
      <button type="button" id="announce-close" class="announce-close" aria-label="閉じる">✕</button>
      <span class="announce-badge">INFORMATION</span>
      <h2 class="announce-title">お知らせ</h2>
      <p class="announce-date" id="announce-date"></p>
      <p class="announce-body" id="announce-body"></p>
      <div class="announce-divider"></div>
      <p class="announce-footer">PLEASE CHECK THE LATEST UPDATE</p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
